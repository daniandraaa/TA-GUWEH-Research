complete_crop_after_seconds: 0.30
ludb_version: 1.0.1
ludb_records: 200
ludb_detection_tolerance_seconds: 0.10
ludb_gate:
  minimum_detection_f1: 0.95
  minimum_boundary_coverage: 0.90
