# V13 — protokol yang mengikuti proposal TA (Opsi A).
# Skenario 1 Baseline: data asli, konfigurasi default, tanpa GAN, tanpa grid.
# Skenario 2 Fine-tuning: augmentasi GAN (V7, lolos QC) + Grid Search LR x batch.
# Resep training lain identik pada kedua skenario agar selisih hanya berasal dari GAN + grid.
source_v4_run: 20261002_patient_mil_hybrids_v4
source_v7_run: 20261004_fit_distribution_gan_v7
models: [encoder, patchtst, hierarchical]
pooling: mean
folds: [1, 2, 3, 4, 5]
cv_seeds: [42, 43, 44]
final_seeds: [42, 43, 44, 45, 46]
primary_seed: 42
sampling_rate: 2000
segment_length: 5000
segments_per_patient: 4
evaluation_segment_chunk: 16
minimum_free_gib: 1.5  # run penuh ±0,5 GB
baseline:
  id: baseline
  learning_rate: 0.001
  # batch_size = anggaran segmen; 4 segmen/pasien => 8 pasien per minibatch.
  batch_size: 32
grid:
  learning_rates: [0.0001, 0.0005, 0.001]
  batch_sizes: [16, 32, 64]
training:
  optimizer: AdamW
  weight_decay: 0.0001
  epochs: 100
  patience: 15
  scheduler_t_max: 100
  minimum_lr: 0.000001
  gradient_clip: 1.0
  class_weighting: inverse_training_patient_class_frequency
gan_augmentation:
  method: replace_one_of_four_windows_with_same_class_synthetic
  replacements_per_full_bag: 1
  validation_augmented: false
  cv_source: v7_fold_generator_fit_on_training_fold_only
  final_source: v13_final_generator_fit_on_development_only
final_gan:
  inner_reference_fraction: 0.2
  inner_split_seed: 6042
  seed: 13042
selection:
  metric: mean_patient_macro_f1_over_folds_and_cv_seeds
  tiebreak: [lower_sd, scenario_id]
  final_epochs: median_best_epoch_of_selected_cases
statistics:
  bootstrap_resamples: 5000
  bootstrap_seed: 20261008
  alpha: 0.05
  multiple_comparison: holm
shap:
  background_segments: 30
  explained_patients: 15
  nsamples: 100
  seed: 20261008
historical_test_previously_observed: true
pretrained_weights_used: false
